name: Daily Morning Anchor Pipeline

on:
  schedule:
    - cron: '0 11 * * *' # Daily at 6:00 AM CDT (11:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (Native FFmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Morning Anchor Daily Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python morning_anchor.py

      - name: Commit and Push Updated Audio & Feeds
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "Automated daily podcast release - ${timestamp}" || echo "No changes to commit"
          git push origin main
