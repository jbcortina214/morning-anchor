name: Daily Morning Anchor Pipeline

on:
  schedule:
    # Runs daily at 11:30 UTC (6:30 AM CDT)
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning Anchor Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python morning_anchor.py

      - name: Commit and Push Updated State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json feed.xml covers/ transcripts/ chapters/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated episode build: $(date -u +'%Y-%m-%d')" && git push)
