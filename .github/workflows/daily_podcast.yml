name: Daily Morning Anchor Pipeline

on:
  schedule:
    # Runs daily at 10:00 UTC / 5:00 AM CST
    - cron: '0 10 * * *'
  # Allows manually triggering the run from the GitHub Actions tab anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out repository code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python environment
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Install system dependencies (FFmpeg)
      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      # 4. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Execute Morning Anchor Generator Script
      - name: Run Morning Anchor Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python morning_anchor.py

      # 6. Commit and Push Generated Assets back to repository
      - name: Commit and push updated assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add docs/feed.xml episodes/ covers/
          
          # Only commit if changes exist (prevents workflow errors on empty diff)
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated daily update: $(date +'%Y-%m-%d')"
            git push origin main
          fi
